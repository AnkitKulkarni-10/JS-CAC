<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creating new elements in DOM</title>
</head>
<body
style = "background-color: rgb(56, 55, 55); color: white;">
</body>
<script>
//Creating a new HTML element in DOM
const div = document.createElement('div')
div.className = "main"
div.id = Math.round(Math.random()*10 + 1)
console.log(div);
//Setting custom attributes
div.setAttribute("title", "generated title")
div.style.backgroundColor = "orange"
// div.innerText = "Chai aur code"
const addText = document.createTextNode("Chai aur code")
div.appendChild(addText)
//Attching the element from the memory onto the Document:
document.body.appendChild(div); //This will attach the div onto the webpage
</script>
</html>
