<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XHR.readyState (XmlHTTPRequest: An object mehtod to send and recieve data) [Legacy method]</title>
</head>
<body style="background-color: #212121; color: aliceblue;"> 
<h1>States:</h1>
0	UNSENT	Client has been created. open() not called yet.
1	OPENED	open() has been called.
2	HEADERS_RECEIVED	send() has been called, and headers and status are available.
3	LOADING	Downloading; responseText holds partial data.
4	DONE	The operation is complete.
</body>
<script>
    const requestUrl = 'https://api.github.com/users/hiteshchoudhary'
    const xhr =  new XMLHttpRequest()
    xhr.open('GET', requestUrl)
    xhr.onreadystatechange = function(){
        console.log(xhr.readyState); //To track the states continuously (In the console)
        if(xhr.readyState === 4){
            const data = JSON.parse(this.responseText); //responseText here is basicaly the api object(data) which is brought to us
            console.log(typeof data) //String (So we need to convert this string to object(JSON object)): Using JSON.parse
            console.log(data.followers);
            

        }
    }
    xhr.send()
</script>
</html>
