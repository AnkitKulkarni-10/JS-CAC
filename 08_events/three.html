<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async and web APIs</title>
</head>
<body>
    <h1>Chai aur Javascript</h1>
    <button id="start">Start</button>
    <button id="stop">Stop</button>
    
</body>
<script>
/*The setInterval() method of the Window interface repeatedly calls a function or executes a code snippet, with a fixed time delay between each call.
const sayDate = function(str){
 console.log(str, Date.now());
 
}
const intervalId = setInterval(sayDate,1000,'Hi')
//clearInteval() method:
clearInterval(intervalId); */

//Adding Event listeners to the buttons (To start and stop the setInterval () method)
let interval;
document.querySelector('#start').addEventListener('click', function(){
    interval = setInterval(function(){
        console.log("Lerning setInterval()");
        
    },2000)
})
document.querySelector('#stop').addEventListener('click', function(){
    clearInterval(interval);
})

</script>
</html>
